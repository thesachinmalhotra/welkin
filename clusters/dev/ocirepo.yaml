# Flux OCIRepository for the Welkin platform artifact.
# Pulls the cosign-signed OCI artifact built by .github/workflows/build.yaml.
# Promotion dev->staging->prod = repin `spec.ref.tag` (no rebuild).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: welkin
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/OWNER/welkin-manifests
  ref:
    tag: "REPLACE_WITH_PINNED_TAG"
  verify:
    provider: cosign
    secretRef:
      name: cosign-public-key
