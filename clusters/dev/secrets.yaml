# Verification + decryption key secrets (GitOps-side).
# Populate the data fields from the generated keys (see docs/runbooks/keys.md):
#   cosign-public-key.cosign.pub  <- cosign pub key (matches CI COSIGN_PRIVATE_KEY)
#   sops-age.age.agekey            <- age private key (matches CI SOPS_AGE_KEY)
# These are cluster Secrets, not committed. Generate once, store in a sealed
# secret / external secret in real clusters.
---
apiVersion: v1
kind: Secret
metadata:
  name: cosign-public-key
  namespace: flux-system
type: Opaque
data:
  cosign.pub: "REPLACE_WITH_BASE64_COSIGN_PUB"
---
apiVersion: v1
kind: Secret
metadata:
  name: sops-age
  namespace: flux-system
type: Opaque
data:
  age.agekey: "REPLACE_WITH_BASE64_AGE_PRIVATE_KEY"
