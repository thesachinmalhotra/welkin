# Decryption key secret (GitOps-side).
# Verification is keyless (matchOIDCIdentity in ocirepo.yaml) — no
# cosign-public-key Secret. Only the SOPS age key remains:
#   sops-age.age.agekey            <- age private key (matches CI SOPS_AGE_KEY)
# This is a cluster Secret, not committed. Generate once, store in a sealed
# secret / external secret in real clusters. See docs/runbooks/keys.md.
---
apiVersion: v1
kind: Secret
metadata:
  name: sops-age
  namespace: flux-system
type: Opaque
data:
  age.agekey: "REPLACE_WITH_BASE64_AGE_PRIVATE_KEY"
