# Image reflection for upstream chart drift. The image-reflector watches
# new tags; image-automation can then open a PR. Because Welkin's chart
# versions live in CUE (platform/welkin.bundle.cue -> product.charts), the
# auto-PATCH step bumps product.cue via a small CI job (see docs/runbooks/
# image-automation.md) rather than Flux patching YAML. Reflection here gives
# us the "what's new" signal; the build.yaml re-render+push closes the loop.
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: benthos-collector
  namespace: flux-system
spec:
  image: ghcr.io/openmeterio/benthos-collector
  interval: 24h
  ref:
    semver: ">=1.0.0-beta.0"
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: openmeter
  namespace: flux-system
spec:
  image: ghcr.io/openmeterio/helm-charts/openmeter
  interval: 24h
  ref:
    semver: ">=1.0.0-beta.0"
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: benthos-collector
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: benthos-collector
  policy:
    semver:
      range: ">=1.0.0-beta.0"
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: openmeter
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: openmeter
  policy:
    semver:
      range: ">=1.0.0-beta.0"
