# Build, sign, and push the Welkin platform artifact.
#
# Pipeline (matches docs/architecture.md):
#   1. timoni bundle build        -> plain manifests (no secrets inline)
#   2. generate SOPS-encrypted Secrets from CI secrets (age public key in .sops.yaml)
#   3. flux push artifact         -> OCI artifact (signed, encrypted), digest captured
#   4. cosign sign (keyless)      -> binds GHA OIDC identity, verified via
#                                    matchOIDCIdentity in clusters/*/ocirepo.yaml
#
# Required repo secrets:
#   OPENMETER_API_KEY, STRIPE_API_KEY,
#   ARCHIVE_S3_ACCESS_KEY_ID, ARCHIVE_S3_SECRET_ACCESS_KEY
# (SOPS_AGE_KEY still needs to decode secrets at apply time, but cosign is
# keyless — no COSIGN_PRIVATE_KEY; no cosign-public-key secret on the cluster.)
# The age PUBLIC key lives in .sops.yaml (committed); the age private key is
# only needed by Flux at apply time (clusters/*/secrets.yaml).

name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  ARTIFACT: oci://ghcr.io/${{ github.repository_owner }}/welkin-manifests
  TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install timoni
        run: |
          curl -fsSL -o /tmp/timoni.tgz https://github.com/stefanprodan/timoni/releases/download/v0.34.0/timoni_0.34.0_linux_amd64.tar.gz
          tar -xzf /tmp/timoni.tgz -C /tmp
          install -m 0755 /tmp/timoni /usr/local/bin/timoni

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Install sops
        run: |
          curl -fsSL -o /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/download/v3.9.1/sops-v3.9.1.linux.amd64
          chmod +x /usr/local/bin/sops

      - name: Install flux
        run: curl -fsSL https://fluxcd.io/install.sh | bash

      - name: Render platform bundle
        run: timoni bundle build -f platform/welkin.bundle.cue > /tmp/welkin-manifests.yaml

      - name: Generate SOPS-encrypted Secrets and assemble Flux artifact directory
        env:
          OPENMETER_API_KEY: ${{ secrets.OPENMETER_API_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          ARCHIVE_S3_ACCESS_KEY_ID: ${{ secrets.ARCHIVE_S3_ACCESS_KEY_ID }}
          ARCHIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.ARCHIVE_S3_SECRET_ACCESS_KEY }}
        run: |
          cat > /tmp/welkin-secrets.yaml <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: welkin-openmeter-token
            namespace: welkin-system
          type: Opaque
          stringData:
            OPENMETER_API_KEY: "$OPENMETER_API_KEY"
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: welkin-stripe
            namespace: openmeter-system
          type: Opaque
          stringData:
            STRIPE_API_KEY: "$STRIPE_API_KEY"
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: welkin-archive-s3
            namespace: welkin-system
          type: Opaque
          stringData:
            ARCHIVE_ACCESS_KEY_ID: "$ARCHIVE_S3_ACCESS_KEY_ID"
            ARCHIVE_SECRET_ACCESS_KEY: "$ARCHIVE_S3_SECRET_ACCESS_KEY"
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: welkin-minio
            namespace: welkin-system
          type: Opaque
          stringData:
            root-user: "$ARCHIVE_S3_ACCESS_KEY_ID"
            root-password: "$ARCHIVE_S3_SECRET_ACCESS_KEY"
          EOF
          # .sops.yaml carries the age public key -> encrypts stringData only.
          sops --encrypt -i /tmp/welkin-secrets.yaml
          # Flux artifact is deliberately split by lifecycle dependency so CRDs
          # and controllers exist before their custom resources are reconciled.
          # The three Flux Kustomizations in clusters/dev consume these paths:
          # foundation -> infra -> apps.
          mkdir -p /tmp/artifact/foundation /tmp/artifact/infra/cilium /tmp/artifact/infra/kyverno /tmp/artifact/infra/strimzi /tmp/artifact/apps
          cp /tmp/welkin-secrets.yaml /tmp/artifact/foundation/welkin-secrets.yaml
          rm -f /tmp/artifact/foundation/welkin.yaml /tmp/artifact/apps/welkin.yaml
          awk '
          /^# Instance: / {
            instance=$3
            if (instance ~ /^(cilium|kyverno|strimzi|postgres|minio)$/) out="/tmp/artifact/foundation/welkin.yaml"
            else if (instance ~ /^(openmeter|collector|archive)$/) out="/tmp/artifact/apps/welkin.yaml"
            else { print "unexpected instance " instance > "/dev/stderr"; exit 1 }
            next
          }
          /^---$/ { next }
          /^apiVersion:/ { print "---" > out; print > out; next }
          out != "" { print > out; next }
          NF { print "unexpected rendered line for instance " instance > "/dev/stderr"; exit 1 }
          ' /tmp/welkin-manifests.yaml
          test -s /tmp/artifact/foundation/welkin.yaml
          test -s /tmp/artifact/apps/welkin.yaml
          cp platform/infra/cilium/*.yaml /tmp/artifact/infra/cilium/
          cp platform/infra/kyverno/*.yaml /tmp/artifact/infra/kyverno/
          cp platform/infra/strimzi/*.yaml /tmp/artifact/infra/strimzi/
          cat > /tmp/artifact/foundation/kustomization.yaml <<'EOF'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
          - welkin.yaml
          - welkin-secrets.yaml
          EOF
          cat > /tmp/artifact/infra/kustomization.yaml <<'EOF'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
          - cilium/base-allow.ciliumclusterwidenetworkpolicy.yaml
          - cilium/default-deny.ciliumclusterwidenetworkpolicy.yaml
          - cilium/workload-policies.yaml
          - kyverno/policies.yaml
          - strimzi/kafka.yaml
          - strimzi/kafka-users.yaml
          EOF
          cat > /tmp/artifact/apps/kustomization.yaml <<'EOF'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
          - welkin.yaml
          EOF
          # Build each artifact stage exactly as Flux kustomize-controller will.
          kubectl kustomize /tmp/artifact/foundation > /dev/null
          kubectl kustomize /tmp/artifact/infra > /dev/null
          kubectl kustomize /tmp/artifact/apps > /dev/null


      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
          --username ${{ github.actor }} --password-stdin

      - name: Push artifact (Flux, captures immutable digest)
        id: push
        run: |
          DIGEST_URL=$(flux push artifact "$ARTIFACT:$TAG" \
            --path=/tmp/artifact \
            --source="https://github.com/${{ github.repository }}" \
            --revision="${{ github.ref_name }}@sha1:${{ github.sha }}" \
            --output json | jq -r '.repository + "@" + .digest')
          echo "digest_url=$DIGEST_URL" >> "$GITHUB_OUTPUT"

      - name: Cosign sign (keyless, by digest)
        run: cosign sign --yes "${{ steps.push.outputs.digest_url }}"
