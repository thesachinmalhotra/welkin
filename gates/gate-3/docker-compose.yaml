# Welkin Gate 3 composition — Archive Plane (upstream composition only).
#
# Composes the upstream OpenMeter quickstart stack and ADDS the Archive Plane:
#
#   Broker (Kafka: om_default_events, canonical CloudEvents)
#     -> drop_on (independent Redpanda Connect pipeline)
#     -> Object Storage (MinIO, S3-compatible)
#     -> Parquet
#
# The Archive Plane is a SEPARATE process consuming from Kafka, so its failure
# cannot affect Economic Plane processing (AGENTS.md rule 3: planes share the
# event, not failure fate). It is the upstream benthos-collector image running
# gates/gate-3/archive/archive.yaml. No custom code.
#
# Usage:
#   OPENMETER_REPO=/home/sachin/projects/personal/openmeter \
#     docker compose -f gates/gate-3/docker-compose.yaml up -d

include:
  - ../gate-2/docker-compose.yaml

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  archive:
    image: ghcr.io/openmeterio/benthos-collector:latest
    depends_on:
      kafka:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - type: bind
        source: ./archive
        target: /etc/archive
        read_only: true
    command: ["run", "/etc/archive/archive.yaml"]

volumes:
  minio_data:
