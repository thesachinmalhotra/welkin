# Kyverno ClusterPolicies — the "OpenMeter is enemy" guardrails as code.
# Roll out Audit -> Enforce per policy (start Audit, watch PolicyReports,
# then flip validationFailureAction to Enforce).
---
# 1) Generate a default-deny NetworkPolicy in every new namespace (except
#    platform control planes). Cilium already default-denies at L3/L4; this
#    adds a standard NetworkPolicy so even non-Cilium clusters stay isolated.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-deny-networkpolicy
spec:
  rules:
    - name: default-deny
      match:
        any:
          - resources:
              kinds: ["Namespace"]
      exclude:
        any:
          - resources:
              namespaces: ["kube-system", "cilium", "kyverno", "flux-system", "openmeter-system", "welkin-system"]
      generate:
        synchronize: true
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny
        namespace: "{{ request.object.metadata.name }}"
        data:
          spec:
            podSelector: {}
            policyTypes: ["Ingress", "Egress"]
---
# 2) Force automountServiceAccountToken: false on every pod. OpenMeter (and
#    everything else) gets no ambient SA token to abuse.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-no-automount-sa-token
spec:
  rules:
    - name: set-automount-false
      match:
        any:
          - resources:
              kinds: ["Pod"]
      mutate:
        patchStrategicMerge:
          spec:
            automountServiceAccountToken: false
---
# 3) Enforce Pod Security Standards (restricted-lite): no privilege
#    escalation, drop ALL capabilities, run as non-root, read-only root.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-restricted-pss
spec:
  validationFailureAction: Audit
  rules:
    - name: no-privileged-and-drop-caps
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: "privileged, allowPrivilegeEscalation, or added capabilities are forbidden"
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
---
# 4) Block new ClusterRoleBindings outside platform namespaces. OpenMeter's
#    SA therefore cannot be bound to a ClusterRole that would let it read
#    Welkin secrets (cross-namespace secret access is denied by construction).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-clusterrolebindings
spec:
  validationFailureAction: Audit
  rules:
    - name: deny-crb-outside-platform
      match:
        any:
          - resources:
              kinds: ["ClusterRoleBinding"]
      exclude:
        any:
          - subjects:
              - kind: "ServiceAccount"
                namespace: "flux-system"
          - subjects:
              - kind: "ServiceAccount"
                namespace: "kyverno"
      validate:
        message: "ClusterRoleBindings may only be created by flux-system / kyverno"
        deny: {}
---
# 5) Verify container image signatures (cosign). Audit first. Requires a
#    cosign public key in a ConfigMap/Secret referenced by the policy.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
spec:
  validationFailureAction: Audit
  rules:
    - name: verify-cosign
      match:
        any:
          - resources:
              kinds: ["Pod"]
      verifyImages:
        - imageReferences:
            - "ghcr.io/openmeterio/*"
            - "ghcr.io/*/welkin*"
          attestors:
            - entries:
                - staticKey:
                    secret:
                      name: cosign-public-key
                      namespace: kyverno
