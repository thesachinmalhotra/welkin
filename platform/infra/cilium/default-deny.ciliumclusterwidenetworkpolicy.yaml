# Cilium workload default-deny. Platform control-plane namespaces remain outside
# this policy so their upstream-native networking can bootstrap and operate.
# Workload namespaces are explicitly selected so operator/control-plane traffic
# remains owned by the upstream components that provide it.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-welkin-workloads
spec:
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
          - welkin-system
          - openmeter-system
  ingress: []
  egress: []
